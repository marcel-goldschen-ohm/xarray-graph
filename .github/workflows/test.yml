name: test

on:
  push:
    tags: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Install project and run tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Get latest tag
      id: get_tag
      run: |
        git fetch --tags
        LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
        echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

    - name: Check tag
      run: echo "The latest tag is ${{ steps.get_tag.outputs.tag }}"
    
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.8" # uv version
        python-version: ${{ matrix.python-version }}

    - name: Set project version to tag
      run: uv version ${{ steps.get_tag.outputs.tag }}

    - name: Check project version
      run: uv version
    
    - name: Install project
      run: uv sync
    
    - name: Lint check
      run: |
        uv pip install flake8
        uv run flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 examples/ --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Run tests
      run: |
        uv pip install pytest
        uv run pytest tests
